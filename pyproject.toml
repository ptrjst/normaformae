[project]
name = "normaformae"
version = "0.1.0"
description = "Normaformae — domain-aware movement analysis and standard form generation"
requires-python = ">=3.11"

dependencies = [
    # Video and computer vision
    "opencv-python>=4.9",
    "mediapipe>=0.10",

    # Numerical processing
    "numpy>=1.26",

    # Machine learning — static pose classifier
    "scikit-learn>=1.4",
    "joblib>=1.3",

    # Deep learning — sequence classifier (CPU wheel sufficient)
    "torch>=2.2",

    # Desktop UI
    "PyQt6>=6.6",

    # Video download from URL (enabled Slice 3+)
    "yt-dlp>=2024.3",

    # Output rendering
    "jinja2>=3.1",       # HTML document templates
    "weasyprint>=62.0",  # HTML → PDF conversion
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "black>=24.0",
    "ruff>=0.3",
]

[project.scripts]
# Single entry point — startup dialog selects domain, discipline, role
normaformae = "normaformae.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
